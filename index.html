<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main>
      <div class="base">
        <div class="content">
          <form class="form" id="form">
            <input
              class="input"
              type="text"
              id="search"
              placeholder="Ingrese el nombre de la ciudad"
            />
            <div class="content_button">
              <button class="button" id="searchButton" type="submit">
                <img class="image_1" src="./assest/descarga.webp" alt="" />
              </button>
            </div>
          </form>
          <div class="box">
            <div>
              <p class="type_time" id="typeTime">Cargando...</p>
            </div>
            <div class="content_img" id="content_img">
            </div>
            <div class="dat" id="dat">
            </div>
            <div class="content_caracter">
              <div class="caracter">
                <img
                  class="img_caracter"
                  src="./assest/humedad.png"
                  alt=""
                />
                <div class="box_text" id="box_text">
                </div>
              </div>
              <div class="caracter">
                <img
                  class="img_caracter_2"
                  src="./assest/viento.png"
                  alt=""
                />
                <div class="box_text" id="box_text_2">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer>
        <a class="footer-link" href="./kenett.html" target="_blank" rel="noopener noreferrer">
          Desarrollado por Kenett
        </a>
    </footer> 
    <script src="index.js"></script>
  </body>
</html>
